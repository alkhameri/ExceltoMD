name: Publish to VS Code Marketplace
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: marketplace-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag matches the extension version
        if: github.ref_type == 'tag'
        run: |
          node -e 'const expected = "v" + require("./package.json").version; if (process.env.GITHUB_REF_NAME !== expected) { console.error("Release tag must be " + expected); process.exit(1); }'
      - run: npm ci
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run package
      - run: npm run publish:marketplace -- --oidc
